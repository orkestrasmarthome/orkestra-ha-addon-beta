# Home Assistant Add-on manifest template (canonical metadata for CI).
# The PUBLIC store copy lives in github.com/orkestrasmarthome/orkestra-ha-addon
# (orkestra/config.yaml). Monorepo CI syncs this file there after each image build.
# Docs: https://developers.home-assistant.io/docs/add-ons/configuration
name: Orkestra Staging
version: "1.2.114"
slug: orkestra_staging
description: Orkestra development build for local testing and development against the staging API.
url: https://github.com/orkestrasmarthome/orkestra-ha-addon
arch:
  - aarch64
  - amd64
map:
  - data:rw
startup: application
# Start on boot enabled by default for new installs (user can still switch to manual).
boot: auto
init: false

# Ingress sidebar panel — shown for new installs when ingress + panel_* are set.
# Auto-update is intentionally omitted: Supervisor only allows users to opt in manually.
ingress: true
ingress_port: 3001
panel_icon: "mdi:home-lightning-bolt"
panel_title: "Orkestra Staging"
panel_admin: false

# Allow the add-on to talk to the Home Assistant Core API
homeassistant_api: true

# Supervisor API — required for host LAN IP discovery (`GET /network/info`)
hassio_api: true

# Expose Brain HTTP on the host so LAN clients can reach `http://<lan-ip>:3002`
# (Ingress remains the primary HA sidebar entrypoint).
# NOTE: Staging CI remaps this to `3001/tcp: 3002` (+ HOST_PORT) when syncing
# orkestra-ha-addon-beta so Production and Staging can share one HA host.
ports:
  3001/tcp: 3002

# User-configurable options (written to /data/options.json by the Supervisor)
options:
  host_port: "3002"
  home_assistant_url: "http://supervisor/core"
  home_assistant_token: ""
  orkestra_cloud_url: "https://staging-api.orkestra-assistant.com"
  orkestra_portal_url: "https://staging.orkestra-assistant.com"
  orkestra_instance_token: ""
schema:
  host_port: str?
  home_assistant_url: str
  home_assistant_token: str?
  orkestra_cloud_url: url
  orkestra_portal_url: str?
  orkestra_instance_token: password?

environment:
  HOST_PORT: "3002"

image: "ghcr.io/orkestrasmarthome/orkestra-core-{arch}"
